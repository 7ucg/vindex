[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/api", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Baron"]

# Gemeinsame Abhängigkeiten (Versionen live verifiziert, crates.io · 2026-11-22).
# Siehe ARCHITECTURE.md §2 für Begründung und Alternativen.
[workspace.dependencies]
# Async / HTTP
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.13", features = ["gzip"] }
futures = "0.3"
# Scraping / Parsing
scraper = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
m3u8-rs = "6"
# Rate-Limiting / Retry
governor = "0.10"
backon = "1"
# Config / Logging / Fehler
config = "0.15"
dotenvy = "0.15"
tracing = "0.1"
anyhow = "1"
thiserror = "2"
# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
dialoguer = "0.12"
# API
axum = "0.8"
tower = "0.5"

# Interne Crates
vindex-core = { path = "crates/core" }
vindex-api = { path = "crates/api" }
