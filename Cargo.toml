[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/api", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Baron"]
repository = "https://github.com/baron/vindex"
readme = "README.md"
keywords = ["downloader", "streaming", "hls", "aniworld", "scraper"]
categories = ["command-line-utilities", "multimedia::video"]

# Gemeinsame Abhängigkeiten (Versionen live verifiziert, crates.io · 2026-11-22).
# Siehe ARCHITECTURE.md §2 für Begründung und Alternativen.
[workspace.dependencies]
# Async / HTTP
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.13", features = ["gzip", "stream", "cookies"] }
futures = "0.3"
# Scraping / Parsing
scraper = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
m3u8-rs = "6"
# AES-128-CBC für nativen HLS-Downloader (RustCrypto, pure Rust).
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc"] }
# AES-256-GCM für den modernen Filemoon/Byse-Pfad (RustCrypto, pure Rust).
aes-gcm = "0.10.3"
sha2 = "0.10.9"
getrandom = "0.2"
hickory-resolver = "0.24"
# Rate-Limiting / Retry
governor = "0.10"
backon = "1"
# TLS-Impersonate (Anti-Bot Stufe 2, opt-in): Chrome-Fingerprint über BoringSSL.
wreq = "6.0.0-rc.31"
wreq-util = "3.0.0-rc.14"
# Config / Logging / Fehler
config = "0.15"
dotenvy = "0.15"
tracing = "0.1"
anyhow = "1"
thiserror = "2"
# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
dialoguer = "0.12"
# API
axum = "0.8"
tower = "0.5"
# OpenAPI (compile-time Spezifikation; rein Derive-/Makro-basiert, kein axum-Zwang)
utoipa = "6.0.0"

# Interne Crates
vindex-core = { path = "crates/core" }
vindex-api = { path = "crates/api" }
