[package]
name = "vindex-desktop-app"
description = "vindex Desktop (Tauri-Frontend auf der vindex-desktop-Facade)."
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Baron"]
# Bewusst NICHT im Root-Workspace (siehe root Cargo.toml `exclude`): die GUI-Deps
# brauchen WebKitGTK zum Linken, der Workspace-Build soll webkit-frei grün bleiben.

# Eigener Workspace-Root, damit die App ganz unabhängig vom vindex-Workspace baut
# (eigener Lockfile, eigenes target/).
[workspace]

[lib]
name = "vindex_desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Lokaler Stream-Proxy: injiziert den Referer, den <video>/hls.js nicht setzen kann,
# und schreibt HLS-Playlists auf proxied Segment-URLs um.
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
base64 = "0.22"
getrandom = "0.2"
# DNS über 1.1.1.1 (nie System-DNS) — wie der Kern.
hickory-resolver = "0.24"
# Die headless-testbare Facade — der ganze Scraper/Download-Kern lebt dort.
vindex-desktop = { path = "../../" }

[features]
# Vom tauri-cli im Dev-Modus gesetzt.
custom-protocol = ["tauri/custom-protocol"]
