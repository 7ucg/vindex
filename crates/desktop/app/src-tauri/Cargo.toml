[package]
name = "vindex-desktop-app"
description = "vindex Desktop (Tauri-Frontend auf der vindex-desktop-Facade)."
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Baron"]
# Bewusst NICHT im Root-Workspace (siehe root Cargo.toml `exclude`): die GUI-Deps
# brauchen WebKitGTK zum Linken, der Workspace-Build soll webkit-frei grün bleiben.

# Eigener Workspace-Root, damit die App ganz unabhängig vom vindex-Workspace baut
# (eigener Lockfile, eigenes target/).
[workspace]

[lib]
name = "vindex_desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
# Nativer Ordner-/Datei-Dialog (backend-seitig genutzt, kein Frontend-Grant).
tauri-plugin-dialog = "2"
# Fenstergröße/-position über Neustarts merken.
tauri-plugin-window-state = "2"
# Selbst-Update aus den GitHub-Releases (kein eigener Server; signiert).
tauri-plugin-updater = "2"
# Nur eine Instanz; zweiter Start fokussiert das Fenster (+ reicht Deep-Link-Args durch).
tauri-plugin-single-instance = "2"
# vindex://-Links aus dem Browser/OS in die App.
tauri-plugin-deep-link = "2"
# Fenster an Bildschirmecken schnappen (Mini-Player).
tauri-plugin-positioner = "2"
# OS-Infos inkl. System-Locale (für i18n).
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Lokaler Stream-Proxy: injiziert den Referer, den <video>/hls.js nicht setzen kann,
# und schreibt HLS-Playlists auf proxied Segment-URLs um.
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.13", features = ["stream"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
base64 = "0.22"
getrandom = "0.2"
# DNS über 1.1.1.1 (nie System-DNS) — wie der Kern.
hickory-resolver = "0.24"
# Die headless-testbare Facade — der ganze Scraper/Download-Kern lebt dort.
vindex-desktop = { path = "../../" }

[features]
# Vom tauri-cli im Dev-Modus gesetzt.
custom-protocol = ["tauri/custom-protocol"]
