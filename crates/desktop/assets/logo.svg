<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="vindex">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b1030"/>
      <stop offset="1" stop-color="#0c0a16"/>
    </linearGradient>
    <linearGradient id="v" x1="128" y1="120" x2="384" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#b14cff"/>
      <stop offset="1" stop-color="#ff4d9d"/>
    </linearGradient>
    <linearGradient id="play" x1="210" y1="200" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9affef"/>
      <stop offset="1" stop-color="#36d1ff"/>
    </linearGradient>
  </defs>

  <!-- app-icon ground -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <rect x="24.5" y="24.5" width="463" height="463" rx="111.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- the V: a bold chevron reading as both the monogram and a download arrow -->
  <path d="M132 136 L256 392 L380 136 L324 136 L256 274 L188 136 Z" fill="url(#v)"/>

  <!-- play triangle nested in the V's throat: the 'stream/play' heart of the mark -->
  <path d="M226 212 L226 300 L300 256 Z" fill="url(#play)"/>

  <!-- subtle downward motion accent (download) -->
  <path d="M256 300 L256 356" stroke="#ffffff" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round"/>
</svg>
