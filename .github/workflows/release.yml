name: release

# Baut auf einen Tag (v*) signierte Bundles und legt ein GitHub-Release an,
# inkl. latest.json für den Selbst-Updater. Braucht zwei Repo-Secrets:
#   TAURI_SIGNING_PRIVATE_KEY           (aus `tauri signer generate`)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (das Passwort dazu, leer wenn keins)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Systempakete (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: crates/desktop/app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/desktop/app/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Frontend-Abhängigkeiten
        working-directory: crates/desktop/app
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/desktop/app
          tagName: ${{ github.ref_name }}
          releaseName: "vindex ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
