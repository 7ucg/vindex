name: release

# Baut auf einen Tag (v*) signierte Bundles und legt ein GitHub-Release (Draft) an,
# inkl. latest.json für den Selbst-Updater. Braucht zwei Repo-Secrets:
#   TAURI_SIGNING_PRIVATE_KEY           (aus `tauri signer generate`)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (das Passwort dazu, leer wenn keins)
# Die Secrets liegen in der Environment "release" — dort Required Reviewers setzen,
# damit niemand den Signierschlüssel über einen beliebigen Lauf abgreift.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Signieren nur für echte v-Tags — auch bei manuellem Start greift der Key sonst nicht.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Systempakete (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: crates/desktop/app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: crates/desktop/app/src-tauri
          save-if: false

      - name: Frontend-Abhängigkeiten
        working-directory: crates/desktop/app
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/desktop/app
          tagName: ${{ github.ref_name }}
          releaseName: "vindex ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
